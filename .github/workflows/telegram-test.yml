name: Telegram Test Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Send configured Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ vars.TELEGRAM_TEST_CHAT_ID }}
        run: python -m akademik_ilan_takip.cli telegram-test --chat-id "$TELEGRAM_TEST_CHAT_ID"
