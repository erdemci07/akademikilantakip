name: Apply Public Telegram Subscribers Patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-public-subscriptions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public_patch/src/akademik_ilan_takip/cli.py \
            public_patch/src/akademik_ilan_takip/telegram.py \
            public_patch/src/akademik_ilan_takip/subscribers.py \
            public_patch/functions/main.py \
            public_patch/functions/subscription_logic.py \
            public_patch/functions/requirements.txt \
            public_patch/firebase.json \
            public_patch/tests/test_public_subscription.py \
            public_patch/.github/workflows/deploy-telegram-webhook.yml \
            public_patch/docs/HERKESE-ACIK-BOT-KURULUM.md; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
      - name: Apply updates to application paths
        shell: bash
        run: |
          set -euo pipefail
          cp public_patch/src/akademik_ilan_takip/{cli,telegram,subscribers}.py src/akademik_ilan_takip/
          mkdir -p functions tests docs .github/workflows
          cp public_patch/functions/{main,subscription_logic}.py functions/
          cp public_patch/functions/requirements.txt functions/
          cp public_patch/firebase.json ./firebase.json
          cp public_patch/tests/test_public_subscription.py tests/
          cp public_patch/docs/HERKESE-ACIK-BOT-KURULUM.md docs/
          cp public_patch/.github/workflows/deploy-telegram-webhook.yml .github/workflows/
          rm -rf public_patch
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Auto-fix safe Ruff issues (imports and modernized typing)
        run: python -m ruff check --fix functions/ src/akademik_ilan_takip/ tests/
      - name: Lint changes
        run: python -m ruff check .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit and push validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m 'feat: public Telegram subscriptions with Firebase webhook'
            git push origin HEAD:main
          fi
