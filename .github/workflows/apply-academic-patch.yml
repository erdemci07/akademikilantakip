name: Apply Uploaded Academic Patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-academic-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate uploaded files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            akademik_patch/src/akademik_ilan_takip/sources.py \
            akademik_patch/src/akademik_ilan_takip/models.py \
            akademik_patch/src/akademik_ilan_takip/scanner.py \
            akademik_patch/src/akademik_ilan_takip/telegram.py \
            akademik_patch/src/akademik_ilan_takip/cli.py \
            akademik_patch/config/sources.json \
            akademik_patch/tests/test_multisource.py \
            akademik_patch/docs/KURULUM-VE-SINIRLAR.md; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing uploaded patch file: $file"
              exit 1
            fi
          done

      - name: Apply patch to actual application paths
        shell: bash
        run: |
          set -euo pipefail
          cp akademik_patch/src/akademik_ilan_takip/{sources,models,scanner,telegram,cli}.py src/akademik_ilan_takip/
          cp akademik_patch/config/sources.json config/sources.json
          mkdir -p tests docs
          cp akademik_patch/tests/test_multisource.py tests/test_multisource.py
          cp akademik_patch/docs/KURULUM-VE-SINIRLAR.md docs/KURULUM-VE-SINIRLAR.md
          # Remove the staging directory: CI previously linted its duplicate test files.
          rm -rf akademik_patch

      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'

      - name: Fix the identified test import ordering
        run: python -m ruff check --fix tests/test_multisource.py

      - name: Validate lint
        run: python -m ruff check .

      - name: Run all tests
        run: python -m pytest -q

      - name: Commit passing changes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- akademik_patch src/akademik_ilan_takip config/sources.json tests/test_multisource.py docs/KURULUM-VE-SINIRLAR.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: apply academic announcement sources and Telegram links'
            git push origin HEAD:main
          fi
