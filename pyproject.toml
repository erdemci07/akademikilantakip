[project]
name = "akademik-ilan-takip"
version = "0.1.0"
description = "Turkiye akademik ilanlarini izleyen yetkili Telegram botu"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "openai>=1.0,<2",
  "pypdf>=5.0,<6",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21.0,<22",
  "firebase-admin>=6.5,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

